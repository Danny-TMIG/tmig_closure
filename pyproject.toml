# SPDX-License-Identifier: MIT
[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tmig_closure"
version = "0.3.0"
description = "Deterministic closure kernel for capability composition (AESN core)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "The Mark Intelligence Group" }]
keywords = ["closure", "capability", "aesn", "fixed-point", "lattice", "tarski"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Typing :: Typed",
]
dependencies = ["fastapi>=0.115", "pydantic>=2.9", "uvicorn[standard]>=0.32"]

[project.optional-dependencies]
dev = [
  "pytest>=8.3", "pytest-cov>=6.0", "pytest-asyncio>=0.24",
  "hypothesis>=6.115", "httpx>=0.27",
  "ruff>=0.7", "mypy>=1.13",
  "pre-commit>=4.0", "pip-audit>=2.7", "bandit[toml]>=1.7",
  "interrogate>=1.7",
]

[project.scripts]
tmig = "tmig_closure.__main__:main"

[project.urls]
Homepage = "https://github.com/the-mark-intelligence-group/tmig_closure"
Issues = "https://github.com/the-mark-intelligence-group/tmig_closure/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tmig_closure"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E","F","W","I","N","UP","B","A","C4","PT","SIM","TID","RUF","S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S311"]
"src/tmig_closure/mastery/*.py" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["src/tmig_closure"]
["src/tmig_closure"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.interrogate]
ignore-init-method = true
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
ignore-nested-functions = false
ignore-nested-classes = false
ignore-setters = false
fail-under = 100
exclude = ["setup.py", "tests", "docs", "scripts"]
verbose = 1
quiet = false
whitelist-regex = []
color = true
omit-covered-files = false
generate-badge = "."
badge-format = "svg"

[tool.bandit]
exclude_dirs = ["tests", "scripts"]
skips = ["B101", "B603", "B607"]   # asserts are fine in library code
